# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/kegg-map-kit

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.10

    - name: Install dependencies
      # --extra dev: pytest and ruff live in [project.optional-dependencies],
      # which a bare `uv sync` prunes.
      run: uv sync --extra dev

    - name: Check the release tag matches the version in pyproject.toml
      # A release published from a tag that disagrees with the packaged version
      # uploads the wrong number, and PyPI will not let you reuse it.
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        VERSION="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
        echo "tag=$TAG pyproject=$VERSION"
        test "$TAG" = "$VERSION"

    - name: Run tests
      run: uv run pytest -q

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Uses trusted publishing - no API token needed
      # Configure at: https://pypi.org/manage/project/kegg-map-kit/settings/publishing/
