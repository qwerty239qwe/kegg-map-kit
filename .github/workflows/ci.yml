name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        # The suite is offline by design: fetch._urlopen is the only network
        # seam and every test monkeypatches it. A failure here that mentions a
        # socket means a test grew a real request.
        run: pytest -q

  package:
    name: zero-dependency wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build && python -m build

      - name: Assert the wheel declares no runtime dependencies
        # The project's defining promise: `pip install kegg-map-kit` pulls in
        # nothing else. Enforced here rather than trusted.
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          meta = zipfile.ZipFile(wheel).read(
              next(n for n in zipfile.ZipFile(wheel).namelist() if n.endswith("METADATA"))
          ).decode()
          deps = [
              line for line in meta.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          print(f"{wheel.name}: {len(deps)} runtime dependencies")
          for d in deps:
              print("  ", d)
          sys.exit(1 if deps else 0)
          PY

      - name: Install into a clean environment and run the CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/kegg-map-kit --version
          echo "--- installed packages ---"
          /tmp/clean/bin/pip list --format=freeze
